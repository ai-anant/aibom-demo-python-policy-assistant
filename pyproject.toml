[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-assistant"
version = "0.3.0"
description = "RAG policy assistant used as a sample AI application for AIBOM generation demos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anant Shrivastava" }]
keywords = ["aibom", "rag", "langchain", "llm", "fastapi"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    # LLM providers and orchestration
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "openai>=1.50",
    "anthropic>=0.39",
    # Embeddings / vector store
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "chromadb>=0.5",
    # Guardrails, evaluation, observability
    "guardrails-ai>=0.5",
    "ragas>=0.2",
    "langfuse>=2.50",
    "datasets>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
policy-assistant = "policy_assistant.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
